; Doplňuje php.ini-production z oficiálního image (Dockerfile).

expose_php = Off
memory_limit = 256M
max_execution_time = 60

; fileUpload: maxFileSize v app/config/config.neon je 20M
upload_max_filesize = 20M
post_max_size = 24M

date.timezone = Europe/Prague

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; zapnuté kvůli souborům, které aplikace generuje za běhu (temp/cache - DI kontejner, Latte, RobotLoader)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
