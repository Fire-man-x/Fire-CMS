# Globální nastavení Apache produkčního image (Dockerfile), virtual host je v apache-vhost.conf.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Prefork = jeden proces PHP na požadavek. Výchozích 150 procesů by na malé instanci vyčerpalo RAM,
# počet se řídí proměnnou APACHE_MAX_WORKERS (render.yaml), na každý proces počítejte ~40-60 MB.
<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 2
	MaxSpareServers 4
	MaxRequestWorkers ${APACHE_MAX_WORKERS}
	MaxConnectionsPerChild 1000
</IfModule>
